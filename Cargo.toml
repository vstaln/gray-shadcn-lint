[package]
name = "gray-shadcn-lint"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "MIT"
description = "Lint shadcn/Tailwind files on demand and after writes"

[[bin]]
name = "gray-shadcn-lint"
path = "src/main.rs"

[dependencies]
serde_json = "1"
regex = "1"

[profile.release]
strip = true
